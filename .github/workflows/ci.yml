name: CI

"on":
  push:
    branches: ["main", "develop", "enerplanet"]
  pull_request:
    branches: ["main", "enerplanet"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: false
          channels: conda-forge,defaults
          activate-environment: weather_env
          environment-file: infrastructure/env/weather_env.yml
          python-version: "3.12"

      - name: Install package
        shell: bash -l {0}
        run: pip install -e . --no-deps

      - name: Lint
        shell: bash -l {0}
        run: python -m ruff check src/

      - name: Type check
        shell: bash -l {0}
        run: python -m mypy src

      - name: Test with coverage
        shell: bash -l {0}
        run: python -m pytest -q --cov=weather --cov-report=xml

      - name: Smoke test CLI
        shell: bash -l {0}
        run: python -m weather info

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
