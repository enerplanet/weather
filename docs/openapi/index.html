<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>weather point-query API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <!-- Swagger UI via CDN, deliberately unpinned: docs-only page, no build
         step. "Try it out" is disabled (supportedSubmitMethods: []) --
         weather serve has no CORS support (rejected 2026-08-10: real
         consumer is server-to-server, not a browser, so live requests
         from this page have no genuine use case), so leaving it enabled
         would just present a button that fails with a CORS error.
         Renders openapi.yaml directly, which stays the single source of
         truth. Matches buem-gateway's docs viewer for a consistent look
         across the two repos' API docs. -->
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
          supportedSubmitMethods: [],
        });
      };
    </script>
  </body>
</html>
