<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>weather point-query API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <!-- Swagger UI via CDN, deliberately unpinned: docs-only page, no build
         step. "Try it out" is enabled for GET only (supersedes the
         2026-08-10 rejection): weather serve still has no CORS support,
         so clicking Execute against a cross-origin deployment will fail,
         but the panel's real value is the request/curl snippet it builds
         from your filled-in params -- copy that and run it locally
         instead of hand-typing the URL and query string.
         Renders openapi.yaml directly, which stays the single source of
         truth. Matches buem-gateway's docs viewer for a consistent look
         across the two repos' API docs. -->
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
          supportedSubmitMethods: ["get"],
        });
      };
    </script>
  </body>
</html>
