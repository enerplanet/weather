openapi: 3.0.3

info:
  title: weather point-query API
  version: 0.3.0
  description: |
    Hourly weather for a single location and year, read from
    already-processed archives. Given a provider, latitude, longitude
    and year, the API returns the nearest grid cell's hourly series for
    the variables you ask for.

    The service exists because the processed archives sit behind a
    university VPN that a request-serving container cannot join. This
    API runs inside that network boundary so callers can reach the data
    over plain HTTP without filesystem or bulk archive access.

    It does not download or process anything. The relevant provider
    pipeline must already have run for the year you request.

    ## Quick start

    Every request needs an `X-API-Key` header.

    1. `GET /v1/weather/variables` to see which variables exist and
       which `use_case` shortcuts group them.
    2. `GET /v1/weather/providers` to see which years each provider has.
    3. `GET /v1/weather/validate` to pre-flight-check a request (same
       parameters, no archive access) before committing to the real one.
    4. `GET /v1/weather/point` for the data.

    Example:

    `curl -H "X-API-Key: $KEY" "http://127.0.0.1:8080/v1/weather/point?provider=merra-2&lat=48.2&lon=16.4&year=2018&use_case=wind&format=json"`

    ## Choosing variables

    Pass exactly one of `use_case` or `variables`. There is no default:
    a request with neither gets a 400 rather than a silent guess, and a
    request with both is also a 400.

    - `use_case=solar` resolves to `T`, `GHI`, `DHI`, `DNI`
    - `use_case=wind` resolves to `WS_10M`, `U_10M`, `V_10M`
    - `variables=T,WS_10M` names them directly, for combinations no
      `use_case` covers

    `GET /v1/weather/variables` is the authoritative list of both.

    ## Choosing a format

    `format` is independent of which variables you get. It only decides
    how the same data is encoded.

    - `parquet` (default): compact binary, needs a Parquet reader such
      as pyarrow. Cheap if you already depend on pandas.
    - `json`: no dependency beyond a standard JSON decoder, roughly
      twice the size on the wire for a year of hourly data. The right
      choice for a Go or Node caller that would otherwise add a Parquet
      reader for this one endpoint.

    ## Errors

    - `400` your request is wrong: bad or missing parameters, or the
      `use_case`/`variables` rule above
    - `401` missing or invalid `X-API-Key`
    - `404` no archive exists for that provider and year
    - `429` rate limit exceeded, see below
    - `503` the archive exists but is not servable, which is a
      server-side data problem rather than a bad request. Retrying the
      same request will not help.

    All error responses share the same shape: a JSON object with a
    single `error` field, itself an object with `code` (a stable,
    machine-readable snake_case identifier -- branch on this, not on
    `message`), `message` (human-readable), and an optional free-form
    `details` object with per-error context (e.g. which parameter was
    the problem):

    ```json
    {"error": {"code": "unknown_use_case", "message": "Unknown use_case: 'hydro'. Available: solar, wind", "details": {"use_case": "hydro"}}}
    ```

    The same object shape appears wherever an error can occur, including
    a per-provider failure inside `GET /v1/weather/providers`' 200 body
    (see that endpoint below) -- one shape to detect a failure with,
    regardless of where in a response it appears.

    ## Rate limiting

    Per-key fixed window, 60 requests per minute by default. The limit
    guards against many small point queries being used to reconstruct a
    bulk archive. Batch your locations rather than fanning out.

    Every response carries `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset` (seconds until the window resets). A `429` also
    carries `Retry-After` (seconds to wait before retrying).

  license:
    name: MIT
    url: https://github.com/UU-BUEM/weather/blob/main/LICENSE
  contact:
    name: UU-BUEM
    url: https://github.com/UU-BUEM/weather

tags:
  - name: Weather
    description: Point queries and discovery
  - name: Health
    description: Liveness check

paths:
  /v1/weather/point:
    get:
      tags: [Weather]
      summary: Hourly weather at one location and year
      description: |
        Returns the nearest processed grid cell's hourly series for the
        requested variables.

        Pass exactly one of `use_case` or `variables`. Passing neither
        or both returns 400.
      operationId: getWeatherPoint
      parameters:
        - name: provider
          in: query
          required: true
          description: Which reanalysis archive to read from.
          schema:
            type: string
            enum: [era5-land, cosmo-rea6, merra-2]
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 48.2
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 16.4
        - name: year
          in: query
          required: true
          description: Must have a processed archive, see /v1/weather/providers.
          schema:
            type: integer
          example: 2018
        - name: use_case
          in: query
          required: false
          description: Named variable set. Mutually exclusive with `variables`.
          schema:
            type: string
            enum: [solar, wind]
        - name: variables
          in: query
          required: false
          style: form
          explode: false
          description: Explicit variable names. Mutually exclusive with `use_case`.
          schema:
            type: array
            items:
              type: string
              enum: [T, GHI, DHI, DNI, WS_10M, U_10M, V_10M]
          example: [T, GHI, DHI, DNI]
        - name: format
          in: query
          required: false
          description: Wire encoding only. Does not change which variables you get.
          schema:
            type: string
            enum: [parquet, json]
            default: parquet
      responses:
        "200":
          description: |
            8760 rows, or 8784 in a leap year. One column per resolved
            variable, in the order requested.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: |
                  `format=parquet`. Columns in order: the reset
                  DatetimeIndex (tz-naive, hourly), then one column per
                  resolved variable.
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherPointJSON"
              example:
                index: ["2018-01-01T00:30:00Z", "2018-01-01T01:30:00Z"]
                variables:
                  T: [0.89, 0.72]
                  GHI: [0.0, 0.0]
                  DNI: [0.0, 0.0]
                  DHI: [0.0, 0.0]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No processed archive for this provider and year.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |
            Archive exists but is not servable: an unrepaired ERA5-Land
            boundary month, a file predating the lat/lon retention
            convention, or a requested variable this archive predates.
            Server-side data problem, not a bad request.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/weather/validate:
    get:
      tags: [Weather]
      summary: Pre-flight-check a /v1/weather/point request
      description: |
        Structural validation only: parameters present/numeric/in-range,
        and `provider`/`use_case`/`variables` names recognized. Same
        parameters as `/v1/weather/point` (no `format`, since there is no
        encoding choice to validate). Never touches the archive --
        `/v1/weather/point`'s own 404 already fails before opening any
        file, so a `200` here does not itself guarantee the archive
        exists, only that the request is well-formed.
      operationId: validateWeatherPoint
      parameters:
        - name: provider
          in: query
          required: true
          description: Which reanalysis archive to read from.
          schema:
            type: string
            enum: [era5-land, cosmo-rea6, merra-2]
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 48.2
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 16.4
        - name: year
          in: query
          required: true
          schema:
            type: integer
          example: 2018
        - name: use_case
          in: query
          required: false
          description: Named variable set. Mutually exclusive with `variables`.
          schema:
            type: string
            enum: [solar, wind]
        - name: variables
          in: query
          required: false
          style: form
          explode: false
          description: Explicit variable names. Mutually exclusive with `use_case`.
          schema:
            type: array
            items:
              type: string
              enum: [T, GHI, DHI, DNI, WS_10M, U_10M, V_10M]
          example: [T, GHI, DHI, DNI]
      responses:
        "200":
          description: Request is well-formed.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
              example:
                valid: true
                resolved:
                  provider: era5-land
                  variables: [T, GHI, DHI, DNI]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/weather/variables:
    get:
      tags: [Weather]
      summary: List queryable variables and use_case shortcuts
      description: |
        Static registry of every variable `/v1/weather/point` can
        return, with unit and description, plus the `use_case`
        shortcuts that group them.
      operationId: getWeatherVariables
      responses:
        "200":
          description: OK
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariablesResponse"
              example:
                variables:
                  T:
                    unit: degC
                    description: Air temperature at 2m
                  GHI:
                    unit: W/m2
                    description: Global horizontal irradiance
                  WS_10M:
                    unit: m/s
                    description: "Scalar wind speed at 10m, sqrt(U_10M^2 + V_10M^2)"
                use_cases:
                  solar: [T, GHI, DHI, DNI]
                  wind: [WS_10M, U_10M, V_10M]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/weather/providers:
    get:
      tags: [Weather]
      summary: Which years each provider has
      description: |
        Years with a processed archive per provider, inferred from
        filenames on disk. Not a directory listing.

        A provider may report the same `error` object described above
        instead of `years` if its archive location cannot be read.
      operationId: getWeatherProviders
      responses:
        "200":
          description: OK
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
              example:
                providers:
                  era5-land:
                    years: [2018, 2019]
                  cosmo-rea6:
                    years: [2018]
                  merra-2:
                    years: [2018]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/weather/health:
    get:
      tags: [Health]
      summary: Liveness check
      description: |
        Does no filesystem I/O. Use /v1/weather/providers to check
        whether archives are actually available. Nested under `/weather/`
        rather than a bare `/v1/health` -- other services reached through
        the same Orchestrator expose their own `/health` too, and this
        avoids a path collision if those are ever aggregated behind one
        host.
      operationId: getHealth
      responses:
        "200":
          description: OK
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Server misconfigured, no API keys set.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  responses:
    BadRequest:
      description: |
        Missing or non-numeric `lat`, `lon` or `year`, missing
        `provider`, or neither/both of `use_case` and `variables`.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid X-API-Key.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Per-key rate limit exceeded.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  headers:
    RateLimitLimit:
      description: Maximum requests allowed per window for this API key.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the current window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying. Present only on 429.
      schema:
        type: integer

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable, machine-readable snake_case identifier -- branch
                on this, not on `message`. Not enumerated here; see
                weather.errors in the source for the authoritative list.
              example: variables_use_case_required
            message:
              type: string
              example: "Specify one of variables/use_case -- e.g. use_case=solar or variables=T,GHI,DHI,DNI. Available use_case names: solar, wind"
            details:
              type: object
              description: Optional, free-form, no fixed schema.
              additionalProperties: true

    ValidateResponse:
      type: object
      required: [valid, resolved]
      properties:
        valid:
          type: boolean
          enum: [true]
        resolved:
          type: object
          description: |
            What the request resolves to -- `provider` is the canonical
            name (e.g. `era5-land`, even if the request gave an alias
            like `era5`), `variables` is the resolved list (expanded from
            `use_case` if that's what was given).
          required: [provider, variables]
          properties:
            provider:
              type: string
              enum: [era5-land, cosmo-rea6, merra-2]
            variables:
              type: array
              items:
                type: string
                enum: [T, GHI, DHI, DNI, WS_10M, U_10M, V_10M]

    WeatherPointJSON:
      type: object
      description: |
        `variables` is keyed by resolved variable name; each value is an
        array the same length as `index`, in the order requested.

        Missing hours are `null` rather than a bare `NaN` token, which
        is invalid JSON and would break a strict decoder such as Go's
        encoding/json. These do occur, for example at the archive-start
        hour of a boundary-repaired ERA5-Land file.
      required: [index, variables]
      properties:
        index:
          type: array
          description: |
            RFC3339 timestamps with an explicit `Z` (UTC) suffix, e.g.
            `2018-01-01T00:30:00Z` -- parses directly with Go's
            `time.Parse(time.RFC3339, ...)`, no custom layout needed.
          items:
            type: string
            format: date-time
        variables:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
              nullable: true

    VariablesResponse:
      type: object
      required: [variables, use_cases]
      properties:
        variables:
          type: object
          description: Variable name to its unit and description.
          additionalProperties:
            type: object
            required: [unit, description]
            properties:
              unit:
                type: string
              description:
                type: string
        use_cases:
          type: object
          description: Shortcut name to its member variables, in order.
          additionalProperties:
            type: array
            items:
              type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: object
          additionalProperties:
            oneOf:
              - type: object
                required: [years]
                properties:
                  years:
                    type: array
                    items:
                      type: integer
              - $ref: "#/components/schemas/ErrorResponse"
