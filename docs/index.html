<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>weather point-query API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
    <style>
      body { margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <!-- Swagger UI, CDN-loaded: no build step, free/open source (Apache-2.0),
         includes "Try it out" (live requests, not just static rendering) --
         unlike ReDoc's free tier. Renders openapi.yaml directly, which
         stays the single source of truth. -->
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: "./openapi.yaml",
          dom_id: "#swagger-ui",
        });
      };
    </script>
  </body>
</html>
